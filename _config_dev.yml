# Development configuration override
# Use with: bundle exec jekyll build --config _config.yml,_config_dev.yml
# Or: bundle exec jekyll serve --config _config.yml,_config_dev.yml

# Disable ImageMagick for faster builds during development
imagemagick:
  enabled: false

# Disable external source fetching (removes network calls)
external_sources: []
# Note: jekyll-terser is already disabled in main _config.yml
# No need to disable it here again, but it won't run in dev builds


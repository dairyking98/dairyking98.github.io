# -----------------------------------------------------------------------------
# Site Settings
# -----------------------------------------------------------------------------
title: Leonard Chau
description: "Mechanical Engineer, Maker & Researcher — SF Bay Area"
url: "https://leonardchau.com"
baseurl: ""
repository: dairyking98/dairyking98.github.io

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------
remote_theme: "mmistakes/minimal-mistakes@4.26.2"  # used by GitHub Pages
theme: minimal-mistakes-jekyll                       # used for local serving
minimal_mistakes_skin: "default"

# -----------------------------------------------------------------------------
# Build Settings
# -----------------------------------------------------------------------------
permalink: /:categories/:title/
paginate: 6
paginate_path: /blog/page:num/
timezone: America/Los_Angeles

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# -----------------------------------------------------------------------------
# Author
# -----------------------------------------------------------------------------
author:
  name: "Leonard Chau"
  avatar: "/assets/img/leonard.jpg"
  bio: "B.S. Mechanical Engineering (SFSU '26). Maker and researcher building things at the intersection of hardware, optics, and software."
  location: "San Francisco Bay Area, CA"
  email: "leonard.chau@yahoo.com"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dairyking98"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/leonardchau"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/typemealetter"
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://youtube.com/@dairyking98"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:leonard.chau@yahoo.com"

# -----------------------------------------------------------------------------
# Footer
# -----------------------------------------------------------------------------
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dairyking98"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/leonardchau"

# -----------------------------------------------------------------------------
# Reading Files
# -----------------------------------------------------------------------------
include:
  - .htaccess
  - _pages
exclude:
  - bin
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - ".jekyll-cache"
  - ".jekyll-assets-cache"
  - gemfiles
  - Gemfile.lock
  - node_modules
  - README.md

keep_files:
  - .git

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# -----------------------------------------------------------------------------
# Markdown Processing
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /projects/:path/
  # One page per machine, for the machines worth writing about. Not every
  # machine needs one — the inventory table links to a page only when a file
  # here matches that machine's serial. See _includes/machine-spec.html.
  typewriters:
    output: true
    permalink: /collections/typewriters/:path/

# -----------------------------------------------------------------------------
# Defaults
# -----------------------------------------------------------------------------
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      comments: false
      share: false
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
  # _projects
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: false
      share: false
  # _typewriters
  - scope:
      path: ""
      type: typewriters
    values:
      layout: single
      author_profile: false
      share: false
      toc: true
      toc_label: "On this machine"
      toc_sticky: true

# -----------------------------------------------------------------------------
# Sass/SCSS
# -----------------------------------------------------------------------------
sass:
  sass_dir: _sass
  style: compressed

# -----------------------------------------------------------------------------
# HTML Compression
# -----------------------------------------------------------------------------
compress_html:
  clippings: all
  ignore:
    envs: development

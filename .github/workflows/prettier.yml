name: Prettier code formatter

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
    paths:
      - "**/*.md"
      - "**/*.js"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.css"
      - "**/*.scss"
      - "**/*.html"
      - "**/*.liquid"
      - ".prettierrc"
      - ".prettierignore"
      - "package.json"
      - "package-lock.json"

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
      - name: Install Prettier 💾
        run: npm install --save-dev --save-exact prettier @shopify/prettier-plugin-liquid
      - name: Prettier Check 🔎
        id: prettier
        run: npx prettier . --check || echo "has-issues=true" >> $GITHUB_OUTPUT
        continue-on-error: true
      - name: Auto-fix formatting issues 🔧
        if: steps.prettier.outputs.has-issues == 'true'
        run: npx prettier . --write
      - name: Create diff for PRs 📝
        if: steps.prettier.outputs.has-issues == 'true' && github.event_name == 'pull_request'
        run: |
          git diff -- . ':(exclude)package-lock.json' ':(exclude)package.json' > diff.txt || true
          if [ -s diff.txt ]; then
            npm install -g diff2html-cli
            diff2html -i file -s side -F diff.html -- diff.txt
          fi
      - name: Upload html diff ⬆️
        if: steps.prettier.outputs.has-issues == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: HTML Diff
          path: diff.html
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit and push fixes 💾
        if: steps.prettier.outputs.has-issues == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --staged --quiet || git commit -m "style: auto-format with Prettier [skip ci]"
          git push
